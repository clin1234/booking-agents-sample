version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:documentdb
    depends_on:
      - documentdb

  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    command: --username admin --password password123
    restart: unless-stopped
    ports:
      - "10260:10260"
    volumes:
      - documentdb-data:/data/db
    environment:
      - DOCUMENTDB_USERNAME=admin
      - DOCUMENTDB_PASSWORD=password123

volumes:
  documentdb-data:
